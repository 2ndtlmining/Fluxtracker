name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 on 19 Oct 2026; move it
    # deliberately, together with header-smoke.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      # Pinned, not inherited. A clean checkout has no .env file, so database.js would
      # fall through to its 'supabase' default and supabaseClient.js throws at import
      # without SUPABASE_URL. SQLite is also what the tests that touch a real database
      # already use, via their own temp files.
      DB_TYPE: sqlite

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # Matches the deployed container (node:24-alpine) and package.json's engines.
          # Node 20 is end-of-life (2026-04-30) and current supabase-js, vitest and
          # better-sqlite3 need Node 22+ (#434).
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      # Catches what the unit tests cannot: a Svelte component that no longer compiles,
      # a broken import in a route module, an adapter misconfiguration. Cheap (~10s) and
      # it is the same command the Docker image runs.
      - name: Build
        run: npm run build
