name: Header smoke

# CLAUDE.md mandates this harness for any change to hooks.server.js, server.js, the CSP or
# the security headers, and records why: skipping it shipped the #131 CSP that blocked
# SvelteKit's inline hydration script and froze the whole production dashboard on
# "Loading..." through two PRs, with zero console errors and zero failed requests. A rule
# enforced only by memory is exactly the one that already failed.
#
# Gated by path rather than run on every PR: each game is its own ~4-minute runner. Within
# that gate, the `games` job picks how many games run:
#   - a change to a security-sensitive file (hooks.server.js, server.js, svelte.config.js,
#     this workflow, or the harness under scripts/header-smoke/) runs EVERY game;
#   - any other header-only change (component, route or util files in the list below) runs
#     SMOKE_SUBSET, a few games chosen to cover the header's distinct code paths.
# The game list lives once, in SMOKE_GAMES below: adding a game is one edit there.
#
# If this is ever made a required status check, note that a path-filtered workflow reports
# as *skipped*, not passed, and GitHub will block PRs waiting for it. Games left out of the
# subset are simply absent from that run (no per-game check is created), so a required check
# must not name an individual `smoke (<game>)` job either — make the *job* conditional
# instead, or leave it advisory.
on:
  pull_request:
    paths:
      - 'src/hooks.server.js'
      - 'src/server.js'
      - 'svelte.config.js'
      - 'src/lib/components/TerminalHeaderAnimation.svelte'
      - 'src/lib/components/Header.svelte'
      - 'src/lib/stores/appFocus.js'
      - 'src/lib/components/RevenueTransactions.svelte'
      - 'src/lib/components/RevenueTransactionsTable.svelte'
      - 'src/routes/+page.svelte'
      - 'src/routes/+page.server.js'
      - 'src/lib/utils/headerRotation.js'
      - 'src/lib/utils/terminalAnimation.js'
      - 'src/routes/api/core.js'
      - 'scripts/header-smoke/**'
      - '.github/workflows/header-smoke.yml'

concurrency:
  group: header-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  # The single source of truth for which games the smoke covers. Each must be a key of
  # DEPLOYED_GAME_NAMES in scripts/header-smoke/stub-api.mjs (and of check-header.mjs's art
  # signatures). Adding a game means adding it here, and nowhere else in this file.
  SMOKE_GAMES: >-
    valheim minecraft dragonwilds palworld zomboid vrising enshrouded rust windrose
    terraria sevendays ascended hytale reforger
  # Run for header-only changes. Chosen so each takes a different path through the
  # component's intro lookup:
  #   valheim     -- an array of variants picked per app name (pickVariant), the original
  #                  terminalAnimation.js art, and the job that runs the interaction check
  #                  (keep it here, or a subset run skips that check entirely);
  #   dragonwilds -- the exact multi-word registry key 'RuneScape: Dragonwilds' (a near
  #                  miss falls through to the gamepad silently), with variants drawn from
  #                  two different art modules;
  #   zomboid     -- a single-object intro (no variants) from introArt.js, and the longest
  #                  fixture name (projectzomboid + 13 digits = 27 chars), which the narrow
  #                  frame truncates and the wide frame must fit.
  SMOKE_SUBSET: valheim dragonwilds zomboid

jobs:
  games:
    # Ubuntu 24.04 pinned, not ubuntu-latest: that label moves to Ubuntu 26 on 19 Oct 2026,
    # and the smoke relies on the runner image's preinstalled Chrome at known paths.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history, so the diff below can find the merge base with the PR base.
          fetch-depth: 0

      - name: Pick games
        id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Anything that can change what a page is allowed to load, or how the harness
          # judges it, gets every game.
          sensitive='^(src/hooks\.server\.js|src/server\.js|svelte\.config\.js|\.github/workflows/header-smoke\.yml|scripts/header-smoke/.*)$'

          if ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "Could not diff $BASE_SHA...$HEAD_SHA; running every game." >&2
            games="$SMOKE_GAMES"
          elif echo "$changed" | grep -Eq "$sensitive"; then
            echo "Security-sensitive or harness file changed; running every game:"
            echo "$changed" | grep -E "$sensitive" | sed 's/^/  /'
            games="$SMOKE_GAMES"
          else
            echo "Header-only change; running the subset."
            games="$SMOKE_SUBSET"
          fi

          # A subset game missing from SMOKE_GAMES is a typo; fail loudly rather than run
          # a game the full sweep does not.
          for g in $SMOKE_SUBSET; do
            case " $(echo $SMOKE_GAMES) " in
              *" $g "*) ;;
              *) echo "SMOKE_SUBSET game '$g' is not in SMOKE_GAMES." >&2; exit 1 ;;
            esac
          done

          matrix=$(printf '%s\n' $games | jq -R . | jq -cs '{game: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Matrix: $matrix"

  smoke:
    needs: games
    # Pinned for the same reason as the games job: the Locate Chrome step below expects the
    # 24.04 image's preinstalled Chrome.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      # One run covers one game: the component holds a single latestDeployedApp and the
      # dashboard's poll interval is longer than the harness's budget. Separate matrix jobs
      # rather than a loop, so each gets its own runner and its own port 3100 — the
      # harness needs that port exclusively and a stale listener fakes a failure.
      fail-fast: false
      matrix: ${{ fromJSON(needs.games.outputs.matrix) }}

    env:
      DEPLOYED_GAME: ${{ matrix.game }}
      API_PORT: '3100'
      # API_PORT, not VITE_API_URL: it points hooks.server.js's /api/* proxy at the stub so
      # the browser keeps calling same-origin paths. The CSP's `connect-src 'self'` blocks
      # a cross-origin override, and same-origin-via-proxy is the realistic request path.
      BASE_URL: http://127.0.0.1:5199
      STUB_URL: http://127.0.0.1:3100/api/header

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install puppeteer-core
        # --no-save, same as the README: it drives the browser already on the machine
        # rather than downloading its own. Pinned so the driver does not drift with each
        # release (#434); same version the harness is run with locally.
        run: npm install --no-save puppeteer-core@25.12.0

      - name: Locate Chrome
        # The harness's built-in search only knows Windows paths, so Linux needs
        # BROWSER_PATH set explicitly.
        run: |
          for candidate in \
            "$CHROME_BIN" \
            /usr/bin/google-chrome-stable \
            /usr/bin/google-chrome \
            /usr/bin/chromium-browser \
            /usr/bin/chromium; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              echo "BROWSER_PATH=$candidate" >> "$GITHUB_ENV"
              echo "Using $candidate"
              exit 0
            fi
          done
          echo "No Chrome or Chromium found on the runner." >&2
          exit 1

      - name: Start stub API
        run: |
          node scripts/header-smoke/stub-api.mjs > stub.log 2>&1 &
          echo $! > stub.pid
          for _ in $(seq 1 30); do
            curl -sf "$STUB_URL" >/dev/null && exit 0
            sleep 1
          done
          echo "Stub API never came up:" >&2
          cat stub.log >&2
          exit 1

      - name: Start dev server
        run: |
          npm run dev -- --port 5199 > dev.log 2>&1 &
          echo $! > dev.pid
          for _ in $(seq 1 60); do
            curl -sf "$BASE_URL" >/dev/null && exit 0
            sleep 1
          done
          echo "Dev server never came up:" >&2
          cat dev.log >&2
          exit 1

      # A cold Vite dev server compiles each module on first request, and the boot
      # animation cannot start until the client bundle is fetched, compiled and hydrated.
      # That pushed firstText to 2324ms against the harness's `< 1500ms` assertion on the
      # first CI run -- a delay belonging entirely to the dev server, absent from the
      # adapter-node build that ships. Warming measures the app; raising the threshold
      # would blind the check to the regression it exists to catch.
      - name: Warm the dev server
        run: node scripts/header-smoke/warm-dev-server.mjs

      # The warm-up consumed the stub's first carousel call, and the stub deliberately
      # switches to a second fixture app after that call -- which is exactly what the
      # freshness checks look for ("picks up the updated deployed app on a later poll").
      # Restarting it hands the harness the same first-call state a manual run gets; the
      # README says to restart between runs for this reason.
      - name: Restart stub API
        run: |
          kill "$(cat stub.pid)" 2>/dev/null || true
          for _ in $(seq 1 15); do
            curl -sf "$STUB_URL" >/dev/null || break
            sleep 1
          done
          node scripts/header-smoke/stub-api.mjs > stub.log 2>&1 &
          echo $! > stub.pid
          for _ in $(seq 1 30); do
            curl -sf "$STUB_URL" >/dev/null && exit 0
            sleep 1
          done
          echo "Stub API did not restart:" >&2
          cat stub.log >&2
          exit 1

      - name: Run header smoke
        run: node scripts/header-smoke/check-header.mjs

      # Hover pause, click-through, the side panel and the rapid-click single-chain check
      # (PR 10). Game-independent, so one job runs it.
      - name: Run interaction check
        if: matrix.game == 'valheim'
        run: node scripts/header-smoke/check-interaction.mjs

      - name: Server logs
        if: failure()
        run: |
          echo '--- stub.log ---'; cat stub.log || true
          echo '--- dev.log ---';  cat dev.log  || true

      - name: Stop servers
        if: always()
        run: |
          for f in stub.pid dev.pid; do
            [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
          done
